# Two replicas minimum, scaling on CPU. Keep
#   maxReplicas x DATABASE_MAX_OPEN_CONNS (configmap.yaml)
# below the Cloud SQL connection limit (100 on db-custom-1-3840).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sub2api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sub2api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      # Scale in slowly, one pod at a time: every removal ends live streams.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
# Node upgrades and scale-downs may only take one replica at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sub2api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sub2api
