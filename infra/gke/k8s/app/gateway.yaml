# Public entry: a global external Application Load Balancer on the reserved
# static IP "lkv-sub2api-ip". HTTPS serves the Google-managed certificate for
# bigaccount.cc from the certificate map "lkv-sub2api"; HTTP redirects to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sub2api
  annotations:
    networking.gke.io/certmap: lkv-sub2api
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: lkv-sub2api-ip
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    - name: https
      protocol: HTTPS
      port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sub2api
spec:
  parentRefs:
    - name: sub2api
      sectionName: https
  rules:
    - backendRefs:
        - name: sub2api
          port: 80
---
# Plain HTTP only answers with a 301 to the same URL over HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sub2api-http-redirect
spec:
  parentRefs:
    - name: sub2api
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: sub2api
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /health
  targetRef:
    group: ""
    kind: Service
    name: sub2api
---
# Long timeout so streaming (SSE) completions are not cut by the load balancer.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: sub2api
spec:
  default:
    timeoutSec: 3600
    connectionDraining:
      drainingTimeoutSec: 60
  targetRef:
    group: ""
    kind: Service
    name: sub2api
