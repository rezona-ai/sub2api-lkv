apiVersion: apps/v1
kind: Deployment
metadata:
  name: sub2api
spec:
  # No "replicas" here: the HorizontalPodAutoscaler (autoscaling.yaml) owns it,
  # and setting it would reset the count on every deploy.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      # preStop (60s) + the app's own 5s shutdown, with headroom.
      terminationGracePeriodSeconds: 90
      # Replicas must sit in different zones (Autopilot adds a node if needed), so
      # a node or zone loss leaves one serving. Counted per revision, so a
      # rollout is not blocked by the pods it is replacing.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sub2api
          matchLabelKeys:
            - pod-template-hash
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sub2api
          matchLabelKeys:
            - pod-template-hash
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sub2api
          image: SUB2API_IMAGE
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sub2api-config
            - secretRef:
                name: sub2api-env
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The app stops 5s after SIGTERM (fixed upstream), which would cut
          # streaming responses. Delay SIGTERM instead: the pod is removed from
          # the load balancer as soon as it starts terminating, so it gets no
          # new requests while in-flight ones have this long to finish.
          lifecycle:
            preStop:
              sleep:
                seconds: 60
          # The listener only opens after migrations finish, which can take minutes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            # config.yaml and the install marker are regenerated from env on every
            # start (auto setup is idempotent), so nothing here needs to persist.
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
